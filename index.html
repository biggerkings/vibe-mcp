<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>登录享优惠，购票更轻松</title>
  <script>
    // REM 适配方案 - 基于设计稿 750px 宽度
    (function() {
      const baseWidth = 750;
      const baseFontSize = 100; // 1rem = 100px (方便计算)
      
      function setRem() {
        const width = Math.min(window.innerWidth, baseWidth);
        const fontSize = (width / baseWidth) * baseFontSize;
        document.documentElement.style.fontSize = fontSize + 'px';
      }
      
      setRem();
      window.addEventListener('resize', setRem);
      window.addEventListener('orientationchange', setRem);
    })();
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    body {
      background: linear-gradient(180deg, #FDF4ED 0%, #FFFFFF 35%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* 适配 iPhone 安全区域 */
    .safe-area-top {
      padding-top: env(safe-area-inset-top);
    }
    
    .safe-area-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
